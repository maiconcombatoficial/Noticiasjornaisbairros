name: Coletar notícias e publicar no GitHub Pages

on:
  schedule:
    - cron: "*/30 * * * *"   # a cada 30 minutos (horário UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "web/*", "web/icons/**", "package.json", ".github/workflows/coleta.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Partir sempre do main mais recente (evita conflito no JSON entre execuções)
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Coletar notícias
        env:
          DB_PATH: ":memory:"
          EXPORT_DIAS: "10"
        run: npm run coletar
      - name: Salvar JSON atualizado no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/api/*.json
          if git diff --cached --quiet; then
            echo "nada mudou"
          else
            git commit -m "coleta automática: $(date -u +'%Y-%m-%d %H:%M UTC')"
            for tentativa in 1 2 3; do
              git push && break
              echo "push falhou, tentando de novo ($tentativa)"
              git fetch origin main
              # se outra execução gravou o JSON antes, a versão desta coleta (mais nova) prevalece
              git rebase -X theirs origin/main || { git rebase --abort; git reset --hard origin/main; break; }
            done
          fi
      - name: Preparar artefato do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  publicar:
    needs: coletar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
